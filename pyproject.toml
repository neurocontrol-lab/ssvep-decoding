[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssvep-decoding"
version = "0.1.0"
description = "Configurable SSVEP CCA decoding and development stimuli"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "pyserial>=3.5,<4"]

[project.optional-dependencies]
stimulus = ["psychopy>=2024.2"]

[project.scripts]
ssvep-decoding = "ssvep_decoding.cli:main"
ssvep-stimulus = "ssvep_decoding.stimulus:main"

[tool.setuptools.packages.find]
include = ["ssvep_decoding*"]

[tool.setuptools.package-data]
ssvep_decoding = ["profiles/*.json"]
